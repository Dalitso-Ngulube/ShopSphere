name: ShopSphere CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shopsphere-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: shopsphere_test
          POSTGRES_USER: shopsphere_app
          POSTGRES_PASSWORD: shopsphere_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopsphere_app -d shopsphere_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_NAME: shopsphere_test
      TEST_DB_USER: shopsphere_app
      TEST_DB_PASSWORD: shopsphere_ci_password
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check code quality with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Django system checks
        run: |
          python -m django check --settings=config.settings.test

      - name: Check migration consistency
        run: |
          python -m django makemigrations --check --dry-run --settings=config.settings.test

      - name: Run automated tests
        run: |
          python -m pytest -v --reuse-db