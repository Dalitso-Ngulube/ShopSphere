[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsphere"
version = "0.2.0-r1"
description = "ShopSphere modular monolith (Baseline v0.3.1)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<5.2",
    "psycopg[binary]>=3.2,<3.3",
    "django-environ>=0.11,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "ruff>=0.7,<0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "config", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DJ"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps", "tests"]
addopts = "--reuse-db"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*", "tests*"]
namespaces = false